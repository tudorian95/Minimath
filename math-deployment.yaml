apiVersion: apps/v1
kind: Deployment
metadata:
  name: math-api
  labels:
    app: math-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: math-api
  template:
    metadata:
      labels:
        app: math-api
    spec:
      containers:
      - name: api
        image: mathcontainer:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: math-config
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: math-calculator-service
spec:
  type: NodePort
  selector:
    app: math-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: math-worker
  labels:
    app: math-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: math-worker
  template:
    metadata:
      labels:
        app: math-worker
    spec:
      containers:
      - name: worker
        image: mathcontainer:latest
        imagePullPolicy: Never
        command: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "--loglevel=info"]
        envFrom:
        - configMapRef:
            name: math-config
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: math-rabbitmq
  labels:
    app: math-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: math-rabbitmq
  template:
    metadata:
      labels:
        app: math-rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3.12-alpine
        ports:
        - containerPort: 5672
        env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            configMapKeyRef:
              name: math-config
              key: RABBITMQ_DEFAULT_USER
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            configMapKeyRef:
              name: math-config
              key: RABBITMQ_DEFAULT_PASS
---
apiVersion: v1
kind: Service
metadata:
  name: math-rabbitmq
spec:
  selector:
    app: math-rabbitmq
  ports:
  - protocol: TCP
    port: 5672
    targetPort: 5672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: math-postgres
  labels:
    app: math-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: math-postgres
  template:
    metadata:
      labels:
        app: math-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: math-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: math-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: math-config
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: pgdata
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: math-postgres
spec:
  selector:
    app: math-postgres
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
