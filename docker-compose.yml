services:
  api:
    build: .
    command: python -m app.server
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - rabbitmq
  worker:
    build: .
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      - postgres
      - rabbitmq
  rabbitmq:
    image: rabbitmq:3.12-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-mathops}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-mathops}
    ports:
      - "5672:5672"
      - "15672:15672"
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mathops}
      POSTGRES_USER: ${POSTGRES_USER:-mathops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mathops}
    volumes:
      - pgdata:/var/lib/postgresql/data
  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
